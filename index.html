<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- RWD 必備控制宣告 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花咲くれは 歌單整理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
     <div class="menu-container">
     <h1>花咲くれは 歌單整理</h1>
     <button id="menuToggleBtn" class="menu-btn">☰ MENU</button>
     <nav id="menuNav" class="menu-dropdown hidden">
       <a href="index.html" class="active">🎵 歌單列表 </a>
       <a href="covers.html">🎙️ 翻唱歌曲 </a>
       <a href="#" onclick="alert('數據分析頁面開發中！'); return false;">📊 數據分析 </a>
       <a href="#" onclick="alert('關於頁面開發中！'); return false;">ℹ️ 關於 </a>
     </nav>
   </div>
  </header>

  <main class="container">
    <!-- 控制控制列：搜尋與排序 -->
    <section class="controls">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 以歌名、原唱搜尋或#開頭搜尋備註...">
        <button id="clearSearchBtn" class="clear-btn hidden" aria-label="清除搜尋">✕</button>
      </div>
 
      <!-- 內嵌播放器 Toggle Switch 開關 -->
      <label class="embed-toggle-switch" title="內建播放模式">
        <span class="toggle-label-text">內嵌播放 </span>
        <span class="embed-toggle-switch">
        <input type="checkbox" id="embedPlayerToggle">
        <span class="slider"></span>
      </label>
      
      <div class="sort-group">
        <label for="sortSelect">排序：</label>
        <select id="sortSelect">
          <option value="latestStreamDate-desc" selected>最新直播（新 ➔ 舊）</option>
          <option value="latestStreamDate-asc">最新直播（舊 ➔ 新）</option>
          <option value="singCount-desc">演唱次數（高 ➔ 低）</option>
          <option value="singCount-asc">演唱次數（低 ➔ 高）</option>
          <option value="order-asc">演唱序（小 ➔ 大）</option>
          <option value="order-desc">演唱序（大 ➔ 小）</option>
        </select>
      </div>
    </section>

    <!-- 歌曲卡片容器 -->
    <div id="songList" class="song-list"></div>
  </main>
  <footer class="site-footer">
    <p>© 2026 Heman / 網站非官方整理 </p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
